<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MHC Studios: photography and app development from Aylmer, Ontario.">
<meta property="og:title" content="MHC Studios">
<meta property="og:description" content="Photography and app development from Aylmer, Ontario.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mhcstudios.netlify.app">
<title>MHC Studios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, wordmark on top, two brand groups of link rows */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --fg: #16181d;
  --muted: #5d6370;
  --line: #dfe2e8;
  --accent: #185fa5;
  --accent-soft: #e6f0fa;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1a1d23; --fg: #eef0f4; --muted: #a2a8b4;
    --line: #2c3039; --accent: #6aa8e6; --accent-soft: #1b2a3a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d23; --fg: #eef0f4; --muted: #a2a8b4;
  --line: #2c3039; --accent: #6aa8e6; --accent-soft: #1b2a3a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 48px 40px;
}
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
.mark { text-align: center; }
.mark .mhc { font-family: var(--display); font-weight: 600; font-size: 44px; letter-spacing: 0.22em; line-height: 1; padding-left: 0.22em; }
.mark .rule { width: 56px; height: 1px; background: var(--fg); opacity: .5; margin: 14px auto; }
.mark .studios { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: 0.42em; padding-left: 0.42em; color: var(--muted); }
.mark p { margin: 18px 0 0; color: var(--muted); font-size: 14px; }
section { display: flex; flex-direction: column; gap: 10px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 2px; }
.head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.01em; text-wrap: balance; }
.head span { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.tag { margin: -4px 2px 4px; font-size: 13px; color: var(--muted); }
a.row {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; color: var(--fg); text-decoration: none;
  transition: border-color .15s ease, transform .15s ease;
}
a.row:hover { border-color: var(--accent); transform: translateY(-1px); }
a.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 36px; height: 36px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.ico svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.txt { flex: 1; min-width: 0; }
.txt strong { display: block; font-weight: 500; font-size: 15px; }
.txt small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.go { color: var(--muted); font-size: 18px; flex: none; }
a.row.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
a.row.primary .txt small { color: rgba(255,255,255,.82); }
a.row.primary .go { color: #fff; }
a.row.primary .ico { background: rgba(255,255,255,.18); color: #fff; }
footer { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }
@media (prefers-reduced-motion: reduce) { a.row { transition: none; } a.row:hover { transform: none; } }
</style>
</head>
<body>

<main class="wrap">
  <header class="mark">
    <div class="mhc">MHC</div>
    <div class="rule"></div>
    <div class="studios">STUDIOS</div>
    <p>Photography and app development from Aylmer, Ontario</p>
  </header>

  <section aria-labelledby="photo">
    <div class="head"><h2 id="photo">MH Captures/Media</h2><span>Photography</span></div>
    <p class="tag">Events · Portraits · Family · Grad</p>
    <a class="row primary" href="https://www.mhcapturesmedia.com" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span>
      <span class="txt"><strong>Website and bookings</strong><small>mhcapturesmedia.com</small></span>
      <span class="go" aria-hidden="true">→</span>
    </a>
    <a class="row" href="https://www.instagram.com/mh_captures_media/" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <span class="txt"><strong>Instagram</strong><small>@mh_captures_media</small></span>
      <span class="go" aria-hidden="true">→</span>
    </a>
    <a class="row" href="https://www.facebook.com/mhcapturesmedia" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M5 5h14v10H10l-4 4v-4H5z"/></svg></span>
      <span class="txt"><strong>Facebook</strong><small>facebook.com/mhcapturesmedia</small></span>
      <span class="go" aria-hidden="true">→</span>
    </a>
  </section>

  <footer>© 2026 MHC Studios</footer>
</main>
</body>
</html>
